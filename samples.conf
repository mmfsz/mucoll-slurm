# samples.conf — sample manifest (single source of truth).
# Whitespace-delimited; '#' starts a comment. Read by run_chain.sh and submit.py.
#
# Columns:
#   key        unique sample id; also the output sub-directory and submit selector
#   gen_type   generator plugin in gen/: whizard | whizard_lhe | pgun | pythia
#   card       Whizard card filename in cards/production/ (resolved there, then
#              benchmarks); '-' for generators that need no card
#   gridpack   grid directory under output/gridpacks/ (used only if it has .vg
#              files); '-' for none. Name matches the gridpack card stem. One
#              gridpack serves all decayer variants of a process (shared ME).
#
# Naming of cards: resonant  mumu_<PROC>_<FINALSTATE>_[<REGION>_]<DECAYER>_10TeV.sin
#                  inclusive mumu_<FINALSTATE>[_<REGION>]_10TeV.sin
# See cards/README.md for the full cut table.
#
# key                        gen_type      card                                       gridpack
